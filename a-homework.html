<!DOCTYPE html>
<html>
<head>
<title>Zoo Rescue Tracker</title>

<style>

body {
    font-family: Arial;
    background-color: lightblue;
}

h1 {
    background-color: green;
    color: white;
    padding: 15px;
    text-align: center;
    position: sticky;
    top: 0;
}

.animal {
    background-color: white;
    padding: 20px;
    margin: 20px;
    position: relative;
}
footer {
    background-color: green;
    color: white;
    padding: 10px;
    text-align: center;
}

</style>
</head>

<body>

<h1>Zoo Rescue Tracker</h1>

<div class="animal">
    <h2>Lion</h2>
    <p>Status: Recovering</p>
</div>

<div class="animal">
    <h2>Elephant</h2>
    <p>Status: Healthy</p>
</div>

<div class="animal">
    <h2>Tiger</h2>
    <p>Status: Under Treatment</p>
</div>

<footer>
    <p>Protecting Wildlife!</p>
</footer>

</body>
</html>
